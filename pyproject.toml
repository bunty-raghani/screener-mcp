[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screener-mcp"
version = "0.6.0"
description = "Indian Stock Research MCP server powered by Screener.in"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "LogeshR15" }]
keywords = ["mcp", "screener", "indian-stocks", "nse", "bse", "stock-research", "claude", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp>=2.3.0,<3.0.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.4.1"]
ai = [
    "pdfplumber>=0.11.10",
    "chromadb>=1.5.9",
    "sentence-transformers>=6.2.0",
]

[project.urls]
Homepage = "https://github.com/LogeshR15/screener-mcp"
Repository = "https://github.com/LogeshR15/screener-mcp"
Issues = "https://github.com/LogeshR15/screener-mcp/issues"

[project.scripts]
screener-mcp = "screener_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
screener_mcp = ["ui/*.html", "ui/*.js", "ui/*.LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
